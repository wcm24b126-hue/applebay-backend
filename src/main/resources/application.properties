spring.application.name=applebay-backend

# Server dynamic port for Render
server.port=${PORT:8080}

# Database Connection via environment variables with local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/applebay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS Allowed Origin for Frontend
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:3001}
